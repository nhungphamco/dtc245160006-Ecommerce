worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 100k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Exclude query strings, bodies, cookies and Authorization from access logs.
    log_format minishop escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"request_time":$request_time}';
    access_log /dev/stdout minishop;

    # Refresh Docker DNS after the backend container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Internal metrics port: do not publish to the host.
    server {
        listen 8081;
        server_name _;
        access_log off;

        location = /stub_status {
            stub_status;
        }

        location / {
            return 404;
        }
    }

    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # HTTP LAN demo only: no HSTS or upgrade-insecure-requests.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Keep /api and the original query string; never serve SPA HTML here.
        location ~ ^/api(?:/|$) {
            set $backend backend:3000;
            proxy_pass http://$backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            # Origin, Cookie and Set-Cookie pass through unchanged.
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Permissions-Policy;
            proxy_cache off;
            proxy_next_upstream off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            # Backend JSON errors retain their original status/body.
            proxy_intercept_errors off;
            error_page 502 503 504 =503 @api_unavailable;
        }

        location @api_unavailable {
            default_type application/json;
            return 503 '{"success":false,"message":"Dich vu tam thoi chua san sang. Vui long thu lai."}';
        }

        location ~ /\. {
            deny all;
        }

        location /assets/ {
            try_files $uri =404;
            expires 1h;
        }

        location = /index.html {
            expires -1;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}

# Docker API supplies application payloads and timestamps directly.
# Do not add a docker pipeline stage intended for json-file envelopes.
server:
  http_listen_address: 0.0.0.0
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /var/lib/promtail/positions.yaml
  sync_period: 10s
  ignore_invalid_yaml: false

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 262144
    timeout: 10s

scrape_configs:
  - job_name: minishop-docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
        filters:
          - name: label
            values:
              - com.docker.compose.project=ecommerce
          - name: name
            values:
              - '^/ecommerce-(nginx|backend)-[0-9]+$'
    relabel_configs:
      - source_labels:
          - __meta_docker_container_label_com_docker_compose_service
        regex: nginx|backend
        action: keep
      - source_labels:
          - __meta_docker_container_label_com_docker_compose_service
        target_label: service
      - source_labels:
          - __meta_docker_container_name
        regex: '/(.*)'
        target_label: container
        replacement: '$1'
      - target_label: project
        replacement: minishop
      - target_label: job
        replacement: docker

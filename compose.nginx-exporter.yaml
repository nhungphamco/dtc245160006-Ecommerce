services:
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.3
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx:8081/stub_status
      - --web.listen-address=:9113
      - --nginx.timeout=5s
    networks:
      - app_network
      - monitoring_network
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 32m
    cpus: 0.10
    pids_limit: 32
    logging:
      driver: json-file
      options:
        max-size: "3m"
        max-file: "2"

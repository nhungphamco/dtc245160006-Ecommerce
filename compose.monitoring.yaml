# ==============================================================
# MONITORING OVERLAY — Prometheus + Grafana + Exporters
# ==============================================================
# Overlay thứ 3: dùng cùng compose.yaml và compose.nginx.yaml.
# Lệnh chạy:
#   docker compose -f compose.yaml -f compose.nginx.yaml \
#     -f compose.monitoring.yaml up -d
#
# Tất cả exporter chỉ giao tiếp qua monitoring_network nội bộ,
# không expose port ra host. Prometheus và Grafana chỉ bind
# 127.0.0.1, truy cập qua SSH Tunnel khi cần.

services:
  # ==========================================
  # 5. NODE EXPORTER — Host metrics (CPU, RAM, Disk)
  # ==========================================
  # Mount read-only:
  #   /proc  → đọc thông tin process/CPU/memory từ host
  #   /sys   → đọc thông tin phần cứng/device từ host
  #   /      → đọc filesystem để tính dung lượng đĩa
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring_network
    mem_limit: 48m
    cpus: 0.10
    pids_limit: 32
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "3m"
        max-file: "2"

  # ==========================================
  # 6. cADVISOR — Docker container metrics
  # ==========================================
  # Mount read-only:
  #   /var/run/docker.sock → truy cập Docker API để phát hiện container
  #   /sys                 → đọc cgroup metrics (CPU, memory per container)
  #   /var/lib/docker      → đọc disk usage của từng container
  # Không dùng privileged; chỉ mount tối thiểu cần thiết.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    command:
      - "--housekeeping_interval=30s"
      - "--docker_only=true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring_network
    mem_limit: 80m
    cpus: 0.15
    pids_limit: 32
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "3m"
        max-file: "2"

  # ==========================================
  # 7. MYSQL EXPORTER — MySQL metrics
  # ==========================================
  # Kết nối MySQL qua db_network bằng user 'exporter' quyền tối thiểu.
  # Mật khẩu đọc từ biến MYSQL_EXPORTER_PASSWORD trong .env.
  mysql-exporter:
    image: prom/mysqld-exporter:v0.15.1
    restart: unless-stopped
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?Missing MySQL exporter password}
    command:
      - "--mysqld.address=mysql:3306"
      - "--mysqld.username=exporter"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - monitoring_network
      - db_network
    mem_limit: 32m
    cpus: 0.10
    pids_limit: 16
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "3m"
        max-file: "2"

  # ==========================================
  # 8. PROMETHEUS — Metrics storage & collection
  # ==========================================
  # Retention 3 ngày, giới hạn 1 GB dung lượng.
  # Chỉ bind 127.0.0.1:9090, truy cập qua SSH Tunnel.
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=3d"
      - "--storage.tsdb.retention.size=1GB"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - monitoring_network
    mem_limit: 160m
    cpus: 0.25
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ==========================================
  # 9. GRAFANA — Dashboard & visualization
  # ==========================================
  # Mật khẩu admin đọc từ GF_SECURITY_ADMIN_PASSWORD trong .env.
  # Datasource Prometheus được auto-provision khi khởi động.
  grafana:
    image: grafana/grafana-oss:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Missing Grafana admin password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring_network
    mem_limit: 128m
    cpus: 0.20
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

# ==========================================
# PERSISTENT VOLUMES (monitoring)
# ==========================================
volumes:
  prometheus_data:
  grafana_data:

# ==========================================
# DOCKER NETWORKS (monitoring)
# ==========================================
networks:
  monitoring_network:
    driver: bridge
  db_network: {}

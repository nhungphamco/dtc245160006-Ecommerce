# Monitoring with cAdvisor/containerd, MySQL collector fix and Nginx exporter.

services:
  node-exporter:
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    cpus: 0.1
    image: "prom/node-exporter:v1.8.2"
    logging:
      driver: "json-file"
      options:
        max-file: "2"
        max-size: "3m"
    mem_limit: "48m"
    networks:
      monitoring_network: null
    pids_limit: 32
    restart: "unless-stopped"
    security_opt:
      - "no-new-privileges:true"
    volumes:
      -
        bind:
          create_host_path: true
        read_only: true
        source: "/proc"
        target: "/host/proc"
        type: "bind"
      -
        bind:
          create_host_path: true
        read_only: true
        source: "/sys"
        target: "/host/sys"
        type: "bind"
      -
        bind:
          create_host_path: true
        read_only: true
        source: "/"
        target: "/rootfs"
        type: "bind"
  cadvisor:
    command:
      - "--housekeeping_interval=30s"
      - "--docker_only=true"
      - "--containerd=/run/containerd/containerd.sock"
      - "--enable_metrics=cpu,memory,network"
    cpus: 0.15
    image: "ghcr.io/google/cadvisor:0.56.2"
    logging:
      driver: "json-file"
      options:
        max-file: "2"
        max-size: "3m"
    mem_limit: "80m"
    networks:
      monitoring_network: null
    pids_limit: 32
    restart: "unless-stopped"
    security_opt:
      - "no-new-privileges:true"
    volumes:
      -
        bind:
          create_host_path: true
        read_only: true
        source: "/var/run/docker.sock"
        target: "/var/run/docker.sock"
        type: "bind"
      -
        bind:
          create_host_path: true
        read_only: true
        source: "/sys"
        target: "/sys"
        type: "bind"
      -
        bind:
          create_host_path: true
        read_only: true
        source: "/var/lib/docker/"
        target: "/var/lib/docker"
        type: "bind"
      -
        bind:
          create_host_path: false
        read_only: true
        source: "/run/containerd/containerd.sock"
        target: "/run/containerd/containerd.sock"
        type: "bind"
  mysql-exporter:
    command:
      - "--mysqld.address=mysql:3306"
      - "--mysqld.username=exporter"
      - "--no-collect.slave_status"
    cpus: 0.1
    depends_on:
      mysql:
        condition: "service_healthy"
        required: true
    environment:
      MYSQLD_EXPORTER_PASSWORD: "${MYSQL_EXPORTER_PASSWORD:?Missing MySQL exporter password}"
    image: "prom/mysqld-exporter:v0.15.1"
    logging:
      driver: "json-file"
      options:
        max-file: "2"
        max-size: "3m"
    mem_limit: "32m"
    networks:
      db_network: null
      monitoring_network: null
    pids_limit: 16
    restart: "unless-stopped"
    security_opt:
      - "no-new-privileges:true"
  nginx-exporter:
    cap_drop:
      - "ALL"
    command:
      - "--nginx.scrape-uri=http://nginx:8081/stub_status"
      - "--web.listen-address=:9113"
      - "--nginx.timeout=5s"
    cpus: 0.1
    image: "nginx/nginx-prometheus-exporter:1.5.3"
    logging:
      driver: "json-file"
      options:
        max-file: "2"
        max-size: "3m"
    mem_limit: "32m"
    networks:
      app_network: null
      monitoring_network: null
    pids_limit: 32
    read_only: true
    restart: "unless-stopped"
    security_opt:
      - "no-new-privileges:true"
  prometheus:
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=3d"
      - "--storage.tsdb.retention.size=1GB"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
    cpus: 0.25
    image: "prom/prometheus:v2.54.1"
    logging:
      driver: "json-file"
      options:
        max-file: "3"
        max-size: "5m"
    mem_limit: "160m"
    networks:
      monitoring_network: null
    pids_limit: 64
    ports:
      -
        host_ip: "127.0.0.1"
        mode: "ingress"
        protocol: "tcp"
        published: "9090"
        target: 9090
    restart: "unless-stopped"
    security_opt:
      - "no-new-privileges:true"
    volumes:
      -
        bind:
          create_host_path: true
        read_only: true
        source: "./monitoring/prometheus/prometheus.yml"
        target: "/etc/prometheus/prometheus.yml"
        type: "bind"
      -
        source: "prometheus_data"
        target: "/prometheus"
        type: "volume"
        volume: {}
  grafana:
    cpus: 0.2
    depends_on:
      prometheus:
        condition: "service_started"
        required: true
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:?Missing Grafana admin password}"
      GF_SERVER_ROOT_URL: "http://localhost:3000"
      GF_USERS_ALLOW_SIGN_UP: "false"
    image: "grafana/grafana-oss:11.4.0"
    logging:
      driver: "json-file"
      options:
        max-file: "3"
        max-size: "5m"
    mem_limit: "128m"
    networks:
      monitoring_network: null
    pids_limit: 64
    ports:
      -
        host_ip: "127.0.0.1"
        mode: "ingress"
        protocol: "tcp"
        published: "3000"
        target: 3000
    restart: "unless-stopped"
    security_opt:
      - "no-new-privileges:true"
    volumes:
      -
        source: "grafana_data"
        target: "/var/lib/grafana"
        type: "volume"
        volume: {}
      -
        bind:
          create_host_path: true
        read_only: true
        source: "./monitoring/grafana/provisioning"
        target: "/etc/grafana/provisioning"
        type: "bind"
volumes:
  prometheus_data: null
  grafana_data: null
networks:
  monitoring_network:
    driver: "bridge"
